const RUBRIC = {"course": {"code": "111114", "name": "Lập trình ứng dụng di động", "assessment": "Đánh giá cuối kỳ: đồ án nhóm, báo cáo và Demo Day (buổi 12)", "scale": 10, "studentThreshold": 0.5, "classThreshold": 0.75, "note": "Sinh viên đạt một CLO khi được ít nhất 50% điểm tối đa của CLO đó. CLO đạt ở cấp lớp khi ít nhất 75% số sinh viên đạt."}, "levels": [{"code": "A", "name": "Xuất sắc", "ratio": 1}, {"code": "B", "name": "Tốt", "ratio": 0.75}, {"code": "C", "name": "Đạt", "ratio": 0.5}, {"code": "D", "name": "Chưa đạt", "ratio": 0.25}, {"code": "0", "name": "Không có minh chứng", "ratio": 0}], "clos": [{"id": "CLO1", "name": "Thiết kế các thành phần chức năng của ứng dụng di động đáp ứng các yêu cầu đặt ra", "plo": "PLO2 / PI 2.4", "max": 3, "criteria": [{"id": "1.1", "name": "Sơ đồ chức năng và phạm vi", "scope": "group", "max": 0.4, "levels": {"A": "Sơ đồ phân rã đủ nhóm chức năng theo từng actor, khớp hoàn toàn với sản phẩm demo; phạm vi đã làm/chưa làm được nêu rõ kèm lý do.", "B": "Sơ đồ đủ chức năng chính và khớp sản phẩm; thiếu vài chức năng phụ hoặc chưa tách theo actor.", "C": "Có sơ đồ nhưng thiếu một nhóm chức năng hoặc lệch so với sản phẩm ở vài chỗ.", "D": "Sơ đồ sơ sài, không phản ánh sản phẩm thật."}, "guide": "Đặt sơ đồ cạnh ứng dụng đang chạy, đánh dấu từng chức năng có/không có trong sản phẩm. Chỉ chấm sự đầy đủ và khớp của sơ đồ, không chấm hình thức vẽ (thuộc 3.5).", "evidence": "docs/so-do-chuc-nang (file nguồn + ảnh); chương Thiết kế chức năng trong báo cáo; slide Demo Day."}, {"id": "1.2", "name": "Luồng nghiệp vụ chính chạy end-to-end trên Android", "scope": "group", "max": 0.6, "levels": {"A": "Luồng chính (đăng nhập → chọn món → đặt → nhân viên xử lý → hoàn tất) chạy trơn tru trên APK, điện thoại thật, kết nối backend trên server Khoa; không lỗi trong demo.", "B": "Luồng chính chạy đủ trên Android thật; có 1 lỗi nhỏ không chặn luồng hoặc phải thao tác lại một lần.", "C": "Luồng chạy được nhưng phải dùng Expo Go/emulator hoặc backend trên máy cá nhân, hoặc thiếu một bước phụ.", "D": "Luồng bị gián đoạn, có màn hình đỏ hoặc phải dùng dữ liệu giả."}, "guide": "Yêu cầu nhóm chạy kịch bản demo trên APK. Chỉ chấm luồng nghiệp vụ chính; tính năng thiết bị, realtime, xác thực chấm ở tiêu chí riêng.", "evidence": "Demo trực tiếp; file APK; video dự phòng; docs/acceptance-test.md."}, {"id": "1.3", "name": "Xác thực và phân quyền", "scope": "group", "max": 0.4, "levels": {"A": "Đăng ký, đăng nhập, giữ phiên (refresh token), đăng xuất hoạt động; API trả 403 cho sai vai trò; token lưu SecureStore; userId lấy từ token.", "B": "Đủ đăng nhập/đăng xuất và phân quyền ở API; thiếu giữ phiên hoặc một kiểm tra phụ.", "C": "Có đăng nhập nhưng phân quyền chỉ ẩn nút ở ứng dụng, API không kiểm tra vai trò.", "D": "Xác thực không hoạt động hoặc lưu token/mật khẩu không an toàn (AsyncStorage, mật khẩu gốc)."}, "guide": "Thử gọi một API nhân viên bằng token khách (Swagger) và đóng/mở lại ứng dụng để kiểm tra giữ phiên.", "evidence": "Demo; mã stores/auth, AuthGuard/RolesGuard; Swagger."}, {"id": "1.4", "name": "Tích hợp tính năng thiết bị", "scope": "group", "max": 0.3, "levels": {"A": "Ít nhất hai tính năng thiết bị (camera/ảnh, vị trí/bản đồ…) hoạt động trên máy thật; xin quyền đúng lúc, xử lý khi bị từ chối.", "B": "Một tính năng thiết bị hoạt động tốt, xin quyền đúng lúc.", "C": "Có tính năng thiết bị nhưng xin quyền ngay khi mở ứng dụng hoặc lỗi khi bị từ chối quyền.", "D": "Tính năng thiết bị không chạy được trên máy thật."}, "guide": "Thử từ chối quyền một lần để xem ứng dụng có xử lý không.", "evidence": "Demo trên điện thoại thật; khai báo quyền trong app.config."}, {"id": "1.5", "name": "Thông báo thời gian thực (Socket.IO)", "scope": "group", "max": 0.4, "levels": {"A": "Đổi trạng thái ở một máy, máy kia nhận thông báo trong vài giây; socket có xác thực; thông báo lưu SQL Server, mở lại ứng dụng vẫn thấy; tự kết nối lại khi mất mạng.", "B": "Thông báo realtime hoạt động, có lưu lịch sử; thiếu xử lý kết nối lại hoặc mở đúng màn hình.", "C": "Có realtime nhưng không lưu lịch sử hoặc socket không xác thực.", "D": "Không có realtime hoặc chỉ dùng polling."}, "guide": "Demo bằng hai thiết bị; tắt ứng dụng nhận, đổi trạng thái, mở lại để kiểm tra lịch sử.", "evidence": "Demo hai thiết bị; mã gateway/hook realtime; bảng Notifications."}, {"id": "1.6", "name": "Tổ chức thành phần và điều hướng", "scope": "group", "max": 0.3, "levels": {"A": "Component tái sử dụng, theme dùng chung, điều hướng Expo Router đúng mô hình (tab/stack/route động), tách dữ liệu server (TanStack Query) và trạng thái cục bộ (Zustand).", "B": "Cấu trúc rõ ràng, có component dùng chung; còn vài màn hình lặp mã hoặc trộn lẫn trạng thái.", "C": "Chạy được nhưng mã dồn vào ít file lớn, màu/kích thước viết cứng nhiều nơi.", "D": "Không có cấu trúc, sao chép mã giữa các màn hình."}, "guide": "Mở repo, xem thư mục app/, components/, stores/, hooks/. Không chấm số lượng tính năng.", "evidence": "Repo ứng dụng; AGENTS.md; cây thư mục trong báo cáo."}, {"id": "1.7", "name": "Xử lý lỗi và trạng thái dữ liệu", "scope": "group", "max": 0.3, "levels": {"A": "Mọi màn hình dữ liệu có đủ trạng thái đang tải, lỗi (có Thử lại), rỗng; thông báo lỗi từ API (400/409) hiển thị dễ hiểu; mất mạng không làm ứng dụng sập.", "B": "Phần lớn màn hình xử lý đủ trạng thái; còn một màn hình thiếu.", "C": "Chỉ có trạng thái đang tải; lỗi hiển thị thông báo kỹ thuật.", "D": "Mất mạng hoặc lỗi API gây màn hình đỏ/treo."}, "guide": "Bật chế độ máy bay khi đang dùng; thử đặt món đã hết để xem thông báo 409.", "evidence": "Demo; mã màn hình danh sách."}, {"id": "1.8", "name": "Kiểm thử và chất lượng", "scope": "group", "max": 0.3, "levels": {"A": "Bộ test tự động cho logic chính chạy xanh; có kịch bản kiểm thử stored procedure; bug log và một cải tiến hiệu năng có số liệu trước/sau.", "B": "Có test tự động và bug log; thiếu kiểm thử thủ tục hoặc số liệu hiệu năng.", "C": "Chỉ có kiểm thử thủ công được ghi lại.", "D": "Không có minh chứng kiểm thử nào ngoài demo."}, "guide": "Yêu cầu chạy npm test tại chỗ hoặc xem ảnh kết quả có thời gian.", "evidence": "Kết quả npm test; database/tests/; docs/bug-log.md; bảng số liệu hiệu năng."}]}, {"id": "CLO2", "name": "Thiết kế cơ sở dữ liệu đáp ứng cấu trúc dữ liệu phù hợp yêu cầu đặc tả", "plo": "PLO2 / PI 2.5", "max": 2, "criteria": [{"id": "2.1", "name": "Mô hình bảng và chuẩn hóa", "scope": "group", "max": 0.4, "levels": {"A": "Đủ thực thể cho nghiệp vụ, kiểu dữ liệu đúng (NVARCHAR cho tiếng Việt, DECIMAL cho tiền, DATETIME2), không dư thừa dữ liệu; lưu giá tại thời điểm đặt.", "B": "Mô hình hợp lý, có 1–2 điểm chưa tối ưu (kiểu dữ liệu chưa phù hợp, cột dư).", "C": "Thiếu một thực thể cần thiết hoặc lặp dữ liệu gây khó cập nhật.", "D": "Thiết kế sai cơ bản (gộp nhiều thực thể vào một bảng, lưu danh sách trong một cột)."}, "guide": "Chỉ chấm cấu trúc bảng và kiểu dữ liệu; khóa, ràng buộc chấm ở 2.2, 2.3.", "evidence": "database/01-*.sql; ERD; chương Thiết kế dữ liệu."}, {"id": "2.2", "name": "Khóa và quan hệ", "scope": "group", "max": 0.3, "levels": {"A": "Mọi bảng có khóa chính; đủ khóa ngoại; quan hệ n-n có bảng trung gian với khóa kép phù hợp.", "B": "Đủ khóa chính và phần lớn khóa ngoại; thiếu một khóa ngoại.", "C": "Thiếu nhiều khóa ngoại, quan hệ chỉ thể hiện bằng quy ước đặt tên.", "D": "Thiếu khóa chính hoặc không có khóa ngoại."}, "guide": "Truy vấn sys.foreign_keys trên CSDL thật để đếm khóa ngoại.", "evidence": "CSDL trên server Khoa; script tạo bảng."}, {"id": "2.3", "name": "Ràng buộc toàn vẹn", "scope": "group", "max": 0.3, "levels": {"A": "Dùng đúng NOT NULL, UNIQUE, CHECK, DEFAULT cho quy tắc nghiệp vụ (tồn kho ≥ 0, trạng thái hợp lệ, email duy nhất), đặt tên ràng buộc theo quy ước.", "B": "Có phần lớn ràng buộc cần thiết; thiếu 1–2 ràng buộc quan trọng.", "C": "Chỉ có NOT NULL/khóa, quy tắc nghiệp vụ để ứng dụng tự kiểm tra.", "D": "Không có ràng buộc ngoài khóa chính."}, "guide": "Thử chèn dữ liệu vi phạm (tồn kho âm, trạng thái lạ) qua thủ tục const COURSE = RUBRIC.course;
const STORE_KEY = 'rubric-grading-' + COURSE.code;
const CRITERIA = RUBRIC.clos.flatMap((clo) => clo.criteria.map((c) => ({ ...c, clo })));
const DESCRIBED = RUBRIC.levels.filter((l) => l.code !== '0');
const SCOPE = { group: 'Nhóm', individual: 'Cá nhân' };
const CLO_STYLE = ['bg-blue-50 border-blue-200 text-blue-800', 'bg-emerald-50 border-emerald-200 text-emerald-800',
                   'bg-amber-50 border-amber-200 text-amber-800', 'bg-purple-50 border-purple-200 text-purple-800'];
const LEVEL_STYLE = { A: 'text-emerald-700 bg-emerald-50 border-emerald-200', B: 'text-sky-700 bg-sky-50 border-sky-200',
                      C: 'text-amber-700 bg-amber-50 border-amber-200', D: 'text-rose-700 bg-rose-50 border-rose-200',
                      '0': 'text-slate-600 bg-slate-100 border-slate-200' };

// ---------------------------------------------------------------- trạng thái và lưu trữ
const blank = () => ({ version: 1, students: [], groupScores: {}, selected: null });
let state = load();
let tab = 'grade';
let search = '';
const openDetails = new Set();

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    const data = raw ? JSON.parse(raw) : null;
    if (data && Array.isArray(data.students)) return { ...blank(), ...data };
  } catch { /* trình duyệt chặn lưu trữ: vẫn chấm được, nhớ xuất file */ }
  return blank();
}
function save() {
  const el = document.getElementById('saveState');
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    el.textContent = 'Đã lưu ' + new Date().toLocaleTimeString('vi-VN');
  } catch {
    el.textContent = 'Không lưu được trên trình duyệt: hãy xuất JSON sao lưu';
  }
}

// ---------------------------------------------------------------- tính điểm
const round2 = (v) => Math.round(v * 100) / 100;
const fmt = (v) => (v === null || v === undefined || v === '' ? '–' : Number(v).toLocaleString('vi-VN', { maximumFractionDigits: 2 }));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const usesGroup = (st, c) => c.scope === 'group' && st.group && !(st.overrides || {})[c.id];

function score(st, c) {
  const v = usesGroup(st, c) ? (state.groupScores[st.group] || {})[c.id] : (st.scores || {})[c.id];
  return v === undefined ? null : v;
}
function cloScore(st, clo) {
  const vals = clo.criteria.map((c) => score(st, CRITERIA.find((x) => x.id === c.id)));
  return vals.every((v) => v !== null) ? round2(vals.reduce((a, b) => a + b, 0)) : null;
}
function cloPartial(st, clo) {
  return round2(clo.criteria.reduce((a, c) => a + (score(st, CRITERIA.find((x) => x.id === c.id)) ?? 0), 0));
}
function total(st) {
  const vals = RUBRIC.clos.map((clo) => cloScore(st, clo));
  return vals.every((v) => v !== null) ? round2(vals.reduce((a, b) => a + b, 0)) : null;
}
const passed = (v, clo) => (v === null ? null : v >= clo.max * COURSE.studentThreshold - 1e-9);
const gradedCount = (st) => CRITERIA.filter((c) => score(st, c) !== null).length;
const groupSize = (g) => state.students.filter((s) => s.group === g).length;

function setScore(st, c, value) {
  const v = value === null || value === '' || Number.isNaN(value) ? null : round2(Math.min(c.max, Math.max(0, Number(value))));
  if (usesGroup(st, c)) {
    state.groupScores[st.group] = state.groupScores[st.group] || {};
    if (v === null) delete state.groupScores[st.group][c.id]; else state.groupScores[st.group][c.id] = v;
  } else {
    st.scores = st.scores || {};
    if (v === null) delete st.scores[c.id]; else st.scores[c.id] = v;
  }
  save();
  render();
}

function stats() {
  const clos = RUBRIC.clos.map((clo) => {
    const vals = state.students.map((s) => cloScore(s, clo)).filter((v) => v !== null);
    const pass = vals.filter((v) => passed(v, clo)).length;
    const rate = vals.length ? pass / vals.length : null;
    return { clo, n: vals.length, pass, rate, avg: vals.length ? round2(vals.reduce((a, b) => a + b, 0) / vals.length) : null,
             ok: rate === null ? null : rate >= COURSE.classThreshold - 1e-9 };
  });
  const crits = CRITERIA.map((c) => {
    const vals = state.students.map((s) => score(s, c)).filter((v) => v !== null);
    const avg = vals.length ? round2(vals.reduce((a, b) => a + b, 0) / vals.length) : null;
    return { c, n: vals.length, avg, ratio: avg === null ? null : avg / c.max };
  });
  return { clos, crits };
}

// Thay innerHTML gỡ ô đang focus → blur → change → render lồng nhau. Chặn lồng, vẽ lại một lần sau.
let rendering = false, pendingRender = false;
function render() {
  if (rendering) { pendingRender = true; return; }
  rendering = true;
  try { draw(); } finally { rendering = false; }
  if (pendingRender) { pendingRender = false; render(); }
}

function draw() {
  document.getElementById('tabs').innerHTML = TABS.map((t) =>
    `<button data-action="tab" data-tab="${t.id}" class="px-4 py-2.5 border-b-2 whitespace-nowrap ${tab === t.id ? 'border-lhu-blue text-lhu-blue' : 'border-transparent text-slate-500 hover:text-slate-800'}"><i class="fa-solid ${t.icon} mr-1.5"></i>${t.label}</button>`).join('');
  const view = document.getElementById('view');
  view.innerHTML = { grade: viewGrade, report: viewReport, rubric: viewRubric, data: viewData }[tab]();
}

function sidebar() {

  return `<aside class="bg-white border border-slate-200 rounded-2xl p-3 lg:sticky lg:top-28 lg:max-h-[calc(100vh-8rem)] overflow-auto no-print">

function criterionRow(st, c) {
  const v = score(st, c);
  const viaGroup = usesGroup(st, c);
  const groupInfo = c.scope === 'group' && st.group
    ? `<label class="flex items-center gap-1.5 text-[11px] text-slate-500 no-print"><input type="checkbox" data-action="override" data-crit="${c.id}" ${viaGroup ? '' : 'checked'}> Chấm riêng cho SV này</label>
       <span class="text-[11px] ${viaGroup ? 'text-sky-700' : 'text-amber-700'}">${viaGroup ? `Điểm chung nhóm ${esc(st.group)} · áp dụng cho ${groupSize(st.group)} SV` : 'Điểm riêng (không theo nhóm)'}</span>` : '';
  const buttons = RUBRIC.levels.map((l) => {
    const pts = round2(c.max * l.ratio);
    const on = v !== null && Math.abs(v - pts) < 1e-9;
    return `<button data-action="level" data-crit="${c.id}" data-value="${pts}" aria-pressed="${on}" title="${esc(l.name)}${c.levels[l.code] ? ': ' + esc(c.levels[l.code]) : ''}"
      class="lv-btn px-2.5 py-1.5 rounded-lg border text-xs font-bold ${LEVEL_STYLE[l.code]} ${on ? '' : 'opacity-70 hover:opacity-100'}">${l.code} · ${fmt(pts)}</button>`;
  }).join('');
  const levelsText = DESCRIBED.map((l) => `<li><strong class="${LEVEL_STYLE[l.code].split(' ')[0]}">${l.code} - ${esc(l.name)} (${fmt(round2(c.max * l.ratio))}):</strong> ${esc(c.levels[l.code])}</li>`).join('');
  return `<div class="border border-slate-200 rounded-xl p-3 ${v === null ? '' : 'bg-slate-50/60'}">
    <div class="flex flex-wrap items-start justify-between gap-2">
      <div class="min-w-0"><div class="font-bold text-sm">${c.id}. ${esc(c.name)}</div>
        <div class="flex flex-wrap items-center gap-2 mt-1">${badge(SCOPE[c.scope], c.scope === 'group' ? 'bg-sky-50 border-sky-200 text-sky-700' : 'bg-amber-50 border-amber-200 text-amber-700')}
          <span class="text-[11px] text-slate-500">Tối đa ${fmt(c.max)}</span>${groupInfo}</div></div>
      <div class="flex items-center gap-1.5">
        <input type="number" data-input="score" data-crit="${c.id}" value="${v ?? ''}" min="0" max="${c.max}" step="0.05" class="w-20 px-2 py-1.5 border border-slate-300 rounded-lg text-sm font-bold text-right" aria-label="Điểm ${c.id}">

      </div></div>

      <summary class="text-lhu-blue font-bold"><i class="fa-solid fa-circle-info mr-1"></i>Mô tả mức · Gợi ý chấm · Minh chứng</summary>

}

function parseStudents(text) {
  let added = 0, updated = 0;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line || /mssv/i.test(line)) continue;
    const parts = line.split(line.includes('\t') ? '\t' : /[;,]/).map((p) => p.trim().replace(/^"|"$/g, ''));
    const [mssv, name, group = ''] = parts;
    if (!mssv || !name) continue;
    const found = state.students.find((s) => s.mssv === mssv);
    if (found) { found.name = name; found.group = group; updated++; continue; }
    state.students.push({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()), mssv, name, group, scores: {}, overrides: {}, note: '' });
    added++;
  }
  save();
  return { added, updated };
}

// ---------------------------------------------------------------- xuất file
function download(name, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const stamp = () => new Date().toISOString().slice(0, 10);

function gradeTable() {
  const head = ['STT', 'MSSV', 'Họ và tên', 'Nhóm', ...CRITERIA.map((c) => `${c.id} ${c.name} (${c.max})`),
    ...RUBRIC.clos.map((c) => `${c.id} (${c.max})`), `Tổng (${COURSE.scale})`, ...RUBRIC.clos.map((c) => `Đạt ${c.id}`), 'Ghi chú'];
  const rows = state.students.map((s, i) => [i + 1, s.mssv, s.name, s.group, ...CRITERIA.map((c) => score(s, c) ?? ''),
    ...RUBRIC.clos.map((clo) => cloScore(s, clo) ?? ''), total(s) ?? '',
    ...RUBRIC.clos.map((clo) => { const p = passed(cloScore(s, clo), clo); return p === null ? '' : p ? 'Đạt' : 'Chưa đạt'; }), s.note || '']);
  return [head, ...rows];
}

function exportXlsx() {
  if (!state.students.length) return alert('Chưa có sinh viên để xuất.');
  const table = gradeTable();
  if (typeof XLSX === 'undefined') {
    // Không tải được thư viện (mất mạng): xuất CSV mở được bằng Excel
    const csv = '﻿' + table.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
    return download(`Diem-${COURSE.code}-${stamp()}.csv`, new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  }
  const { clos, crits } = stats();
  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.aoa_to_sheet(table);
  ws1['!cols'] = [{ wch: 5 }, { wch: 12 }, { wch: 24 }, { wch: 7 }, ...CRITERIA.map(() => ({ wch: 12 })), ...RUBRIC.clos.map(() => ({ wch: 10 })), { wch: 10 }, ...RUBRIC.clos.map(() => ({ wch: 10 })), { wch: 30 }];

  XLSX.utils.book_append_sheet(wb, ws2, 'Mức đạt CLO');

  const ws3 = XLSX.utils.aoa_to_sheet([
    ['Mã', 'Tiêu chí', 'CLO', 'Phạm vi', 'Điểm tối đa', 'Số SV có điểm', 'Điểm TB', 'TB / tối đa (%)'],
    ...crits.map(({ c, n, avg, ratio }) => [c.id, c.name, c.clo.id, SCOPE[c.scope], c.max, n, avg ?? '', ratio === null ? '' : round2(ratio * 100)]),
  ]);
  ws3['!cols'] = [{ wch: 6 }, { wch: 45 }, { wch: 7 }, { wch: 9 }, { wch: 11 }, { wch: 13 }, { wch: 9 }, { wch: 14 }];
  XLSX.utils.book_append_sheet(wb, ws3, 'Theo tiêu chí');

  const ws4 = XLSX.utils.aoa_to_sheet([
    ['Mã', 'CLO', 'Tiêu chí', 'Phạm vi', 'Điểm tối đa', ...DESCRIBED.map((l) => `${l.code} - ${l.name} (${l.ratio * 100}%)`), 'Gợi ý chấm', 'Minh chứng cần có'],
    ...CRITERIA.map((c) => [c.id, c.clo.id, c.name, SCOPE[c.scope], c.max, ...DESCRIBED.map((l) => c.levels[l.code]), c.guide, c.evidence]),
  ]);
  ws4['!cols'] = [{ wch: 6 }, { wch: 7 }, { wch: 28 }, { wch: 9 }, { wch: 9 }, ...DESCRIBED.map(() => ({ wch: 40 })), { wch: 45 }, { wch: 40 }];
  XLSX.utils.book_append_sheet(wb, ws4, 'Rubric');

  XLSX.writeFile(wb, `Diem-${COURSE.code}-${stamp()}.xlsx`);
}

// ---------------------------------------------------------------- sự kiện
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const st = state.students.find((s) => s.id === state.selected);
  const crit = el.dataset.crit && CRITERIA.find((c) => c.id === el.dataset.crit);
  switch (el.dataset.action) {
    case 'tab': tab = el.dataset.tab; render(); window.scrollTo(0, 0); break;
    case 'select': state.selected = el.dataset.id; save(); render(); window.scrollTo(0, 0); break;
    case 'move': {
      const i = state.students.indexOf(st) + Number(el.dataset.step);
      if (state.students[i]) { state.selected = state.students[i].id; save(); render(); window.scrollTo(0, 0); }
      break;
    }
    case 'level': setScore(st, crit, Number(el.dataset.value)); break;
    case 'clear': setScore(st, crit, null); break;
    case 'override': {
      st.overrides = st.overrides || {};
      if (el.checked) {
        st.overrides[crit.id] = true;
        // Bắt đầu chấm riêng từ điểm nhóm hiện có
        const g = (state.groupScores[st.group] || {})[crit.id];
        if (g !== undefined && (st.scores || {})[crit.id] === undefined) { st.scores = st.scores || {}; st.scores[crit.id] = g; }
      } else {
        delete st.overrides[crit.id];
        if (st.scores) delete st.scores[crit.id];
      }
      save(); render(); break;
    }
    case 'paste': {
      const box = document.getElementById('paste');
      const r = parseStudents(box.value);
      box.value = '';
      render();
      alert(`Đã thêm ${r.added} sinh viên, cập nhật ${r.updated} sinh viên.`);
      break;
    }
    case 'remove': {
      const s = state.students.find((x) => x.id === el.dataset.id);
      if (s && confirm(`Xóa ${s.name} (${s.mssv}) và điểm đã chấm?`)) { state.students = state.students.filter((x) => x !== s); save(); render(); }
      break;
    }
    case 'export-xlsx': exportXlsx(); break;
    case 'export-json':
      download(`Cham-diem-${COURSE.code}-${stamp()}.json`, new Blob([JSON.stringify({ ...state, course: COURSE.code, exportedAt: new Date().toISOString() }, null, 2)], { type: 'application/json' }));
      break;
    case 'reset':
      if (confirm('Xóa toàn bộ danh sách và điểm đã chấm trên trình duyệt này? Nên sao lưu JSON trước.')) { state = blank(); save(); render(); }
      break;
  }
});

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'search') {
    search = el.value;
    const pos = el.selectionStart;
    render();
    const box = document.getElementById('search');
    box.focus(); box.setSelectionRange(pos, pos);
    return;
  }
  if (el.dataset.input === 'note') {
    const st = state.students.find((s) => s.id === state.selected);
    st.note = el.value; save();
  }
  if (el.dataset.edit) {
    const s = state.students.find((x) => x.id === el.dataset.id);
    s[el.dataset.edit] = el.value.trim(); save();
  }
});

document.addEventListener('change', async (e) => {
  const el = e.target;
  if (el.dataset.input === 'score') {
    const st = state.students.find((s) => s.id === state.selected);
    const crit = CRITERIA.find((c) => c.id === el.dataset.crit);
    if (!st || !crit) return;
    const next = el.value === '' ? null : Number(el.value.replace(',', '.'));
    if (next !== score(st, crit)) setScore(st, crit, next);
  }
  if (el.dataset.edit) render();
  if (el.dataset.input === 'csv' && el.files[0]) {
    const r = parseStudents(await el.files[0].text());
    render();
    alert(`Đã thêm ${r.added} sinh viên, cập nhật ${r.updated} sinh viên.`);
  }
  if (el.dataset.input === 'json' && el.files[0]) {
    try {
      const data = JSON.parse(await el.files[0].text());
      if (!Array.isArray(data.students)) throw new Error('Thiếu danh sách students');
      if (data.course && data.course !== COURSE.code && !confirm(`File thuộc học phần ${data.course}, vẫn khôi phục?`)) return;
      state = { ...blank(), students: data.students, groupScores: data.groupScores || {}, selected: data.selected || null };
      save(); render();
      alert(`Đã khôi phục ${state.students.length} sinh viên.`);
    } catch (err) {
      alert('File JSON không hợp lệ: ' + err.message);
    }
  }
});

document.addEventListener('toggle', (e) => {
  const d = e.target;
  if (d.tagName === 'DETAILS' && d.dataset.crit) { d.open ? openDetails.add(d.dataset.crit) : openDetails.delete(d.dataset.crit); }
}, true);

render();
</script>
