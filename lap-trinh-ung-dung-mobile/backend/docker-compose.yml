# Tùy chọn cho máy phát triển: SQL Server 2019 + Redis. Không bắt buộc (có thể dùng SQL Server cài sẵn
# và bỏ trống REDIS_URL để dùng cache bộ nhớ).
#   docker compose up -d
# Sau đó trong .env: DB_SERVER=localhost, DB_USER=sa, DB_PASSWORD=<MSSQL_SA_PASSWORD>, REDIS_URL=redis://localhost:6379
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-LhuFood@2026}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"

volumes:
  mssql-data:
