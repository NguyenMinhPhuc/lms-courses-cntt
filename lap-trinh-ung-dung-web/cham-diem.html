<script>
const RUBRIC = {"course": {"code": "111102", "name": "Lập trình ứng dụng web", "assessment": "Đánh giá cuối kỳ: báo cáo đồ án nhóm (Report) và Demo Day chung với học phần di động (buổi 12)", "scale": 10, "studentThreshold": 0.5, "classThreshold": 0.75, "note": "Sinh viên đạt một CLO khi được ít nhất 50% điểm tối đa của CLO đó. CLO đạt ở cấp lớp khi ít nhất 75% số sinh viên đạt. Minh chứng chính là báo cáo đồ án; Demo Day dùng để kiểm chứng sản phẩm và phần phụ trách của từng thành viên."}, "levels": [{"code": "A", "name": "Xuất sắc", "ratio": 1}, {"code": "B", "name": "Tốt", "ratio": 0.75}, {"code": "C", "name": "Đạt", "ratio": 0.5}, {"code": "D", "name": "Chưa đạt", "ratio": 0.25}, {"code": "0", "name": "Không có minh chứng", "ratio": 0}], "clos": [{"id": "CLO1", "name": "Phân tích các thành phần chức năng của ứng dụng web phù hợp với mô hình đã phân tích", "plo": "PLO2 / PI 2.4", "max": 4, "criteria": [{"id": "1.1", "name": "Phân tích yêu cầu và phạm vi web", "scope": "group", "max": 0.5, "levels": {"A": "Xác định đúng actor và toàn bộ user story web của đề tài (quản trị, quầy, khách), truy vết tới SRS, nêu rõ phạm vi làm/không làm và lý do.", "B": "Đủ actor và user story chính, có truy vết SRS; phạm vi chưa nêu lý do.", "C": "Liệt kê chức năng nhưng thiếu actor hoặc không truy vết tới SRS.", "D": "Mô tả chung chung, không xác định được phạm vi web."}, "guide": "Chỉ chấm phần phân tích yêu cầu (chương Phân tích của báo cáo); sơ đồ chức năng chấm ở 1.2.", "evidence": "Chương Phân tích yêu cầu trong báo cáo; bảng user story đã chọn từ backlog."}, {"id": "1.2", "name": "Sơ đồ chức năng và sitemap", "scope": "group", "max": 0.5, "levels": {"A": "Sơ đồ phân rã chức năng web và sitemap đầy đủ theo vai trò, khớp với sản phẩm đã triển khai.", "B": "Đủ chức năng chính và trang chính, khớp sản phẩm; thiếu vài chức năng phụ.", "C": "Có sơ đồ nhưng thiếu một nhóm chức năng hoặc lệch so với sản phẩm.", "D": "Sơ đồ sơ sài, không phản ánh ứng dụng."}, "guide": "Đặt sitemap cạnh web đang chạy, đánh dấu trang có/không có.", "evidence": "Sơ đồ chức năng, sitemap (file nguồn + ảnh) trong báo cáo."}, {"id": "1.3", "name": "Ánh xạ route – chức năng – vai trò – API", "scope": "group", "max": 0.5, "levels": {"A": "Bảng ánh xạ đầy đủ mọi route của App Router tới chức năng, vai trò được truy cập và endpoint API/stored procedure tương ứng; khớp mã nguồn.", "B": "Bảng đủ route chính, khớp mã; thiếu cột vai trò hoặc API ở vài dòng.", "C": "Bảng thiếu nhiều route hoặc không khớp cấu trúc thư mục app/.", "D": "Không có bảng ánh xạ, chỉ liệt kê trang."}, "guide": "So bảng với cây thư mục app/ của repo.", "evidence": "Bảng ánh xạ trong báo cáo; cây thư mục app/."}, {"id": "1.4", "name": "Thiết kế component và ranh giới Server/Client", "scope": "group", "max": 0.5, "levels": {"A": "Cây component cho các trang chính, nêu rõ component nào là Server/Client và lý do (dữ liệu, tương tác, bảo mật); component dùng chung được tách hợp lý.", "B": "Có cây component và phân loại Server/Client; lý do chưa đầy đủ.", "C": "Có danh sách component nhưng không phân tích ranh giới Server/Client.", "D": "Không có phân tích component; \"use client\" đặt tràn lan không giải thích."}, "guide": "Kiểm tra ngẫu nhiên 2 file có \"use client\" trong repo, đối chiếu với lý do trong báo cáo.", "evidence": "Mục Thiết kế component trong báo cáo; repo web."}, {"id": "1.5", "name": "Phân tích module quản trị", "scope": "group", "max": 0.5, "levels": {"A": "Nghiệp vụ quản trị được phân tích thành bảng, stored procedure và API có phân quyền admin; nêu ràng buộc nghiệp vụ (không xóa danh mục còn món, món đã bán chỉ ngừng bán…).", "B": "Phân tích đủ thủ tục và API cho CRUD chính; thiếu ràng buộc nghiệp vụ.", "C": "Chỉ liệt kê màn hình quản trị, chưa phân tích tới dữ liệu và API.", "D": "Không có phân tích module quản trị."}, "guide": "Chấm phần phân tích; mức hoàn thành sản phẩm chấm ở 1.8.", "evidence": "Chương phân tích module quản trị; ERD phần quản trị; danh mục stored procedure."}, {"id": "1.6", "name": "Phân tích phân quyền và bảo mật", "scope": "group", "max": 0.4, "levels": {"A": "Ma trận vai trò × chức năng đầy đủ; mô tả cơ chế cookie httpOnly, middleware và kiểm tra quyền ở server; nhận diện rủi ro (XSS, CSRF, lộ biến môi trường) và cách phòng.", "B": "Có ma trận phân quyền và cơ chế xác thực; phần rủi ro còn sơ sài.", "C": "Chỉ mô tả đăng nhập, không có ma trận phân quyền.", "D": "Không phân tích phân quyền."}, "guide": "Đối chiếu ma trận với hành vi thật khi đăng nhập bằng tài khoản customer.", "evidence": "Ma trận phân quyền; mục Bảo mật trong báo cáo."}, {"id": "1.7", "name": "Phân tích luồng thời gian thực", "scope": "group", "max": 0.4, "levels": {"A": "Sơ đồ tuần tự màn hình quầy đủ các bên (web nhân viên, ứng dụng khách, API, thủ tục, Socket.IO, room), đúng thứ tự lưu trước gửi sau; nêu cách xử lý mất kết nối.", "B": "Đủ các bên chính; thiếu xử lý kết nối lại hoặc một bước.", "C": "Chỉ thể hiện client ↔ server.", "D": "Không có phân tích luồng realtime."}, "guide": "So với cài đặt thật của màn hình quầy.", "evidence": "Sơ đồ tuần tự trong báo cáo; slide."}, {"id": "1.8", "name": "Sản phẩm triển khai khớp phân tích", "scope": "group", "max": 0.4, "levels": {"A": "Web chạy trên server Khoa, mọi chức năng bắt buộc đã phân tích (quản trị, màn hình quầy realtime, web khách cơ bản) hoạt động trong demo.", "B": "Chức năng bắt buộc hoạt động; 1–2 chức năng phụ đã phân tích chưa có.", "C": "Thiếu một nhóm chức năng bắt buộc hoặc chỉ chạy trên máy cá nhân.", "D": "Sản phẩm không chạy hoặc lệch xa so với phân tích."}, "guide": "Chấm tại Demo Day theo kịch bản của nhóm; đối chiếu với sơ đồ chức năng.", "evidence": "Demo trên server Khoa; link web đã triển khai."}, {"id": "1.9", "name": "Giải thích phân tích và mã phần phụ trách", "scope": "individual", "max": 0.3, "levels": {"A": "Giải thích đúng phần phân tích và đoạn mã mình commit, nêu được lý do thiết kế và hệ quả khi thay đổi.", "B": "Giải thích đúng; lúng túng ở câu hỏi thay đổi giả định.", "C": "Giải thích được một phần, cần gợi ý nhiều.", "D": "Không giải thích được phần mình phụ trách."}, "guide": "Chọn ngẫu nhiên đoạn mã của chính sinh viên (git blame). Phần mã không giải thích được có thể hạ điểm tiêu chí nhóm liên quan cho riêng sinh viên đó.", "evidence": "Hỏi đáp tại Demo Day; lịch sử commit."}]}, {"id": "CLO2", "name": "Thực hiện các bài kiểm thử để kiểm tra các yêu cầu chức năng phù hợp với các mục tiêu dự án", "plo": "PLO4 / PI 4.1", "max": 2, "criteria": [{"id": "2.1", "name": "Kế hoạch kiểm thử", "scope": "group", "max": 0.3, "levels": {"A": "Kế hoạch nêu phạm vi, loại kiểm thử (thủ công, đơn vị, đầu-cuối, phi chức năng), môi trường, dữ liệu thử, tiêu chí bắt đầu/dừng, phân công.", "B": "Đủ phạm vi, loại kiểm thử và môi trường; thiếu tiêu chí dừng hoặc phân công.", "C": "Chỉ liệt kê việc sẽ kiểm thử.", "D": "Không có kế hoạch kiểm thử."}, "guide": "Chấm tài liệu kế hoạch, không chấm số lượng test.", "evidence": "Mục Kế hoạch kiểm thử trong báo cáo kiểm thử."}, {"id": "2.2", "name": "Test case truy vết tới yêu cầu", "scope": "group", "max": 0.5, "levels": {"A": "Test case viết từ tiêu chí nghiệm thu, có ma trận truy vết yêu cầu ↔ test case, gồm trường hợp hợp lệ, không hợp lệ và giá trị biên; mọi story Must có test case.", "B": "Test case truy vết được yêu cầu, phủ story Must; thiếu trường hợp biên.", "C": "Có test case nhưng không truy vết tới yêu cầu hoặc chỉ có trường hợp hợp lệ.", "D": "Test case sơ sài, không kiểm tra được yêu cầu."}, "guide": "Chọn 3 story Must, kiểm tra mỗi story có test case và kết quả.", "evidence": "Bảng test case, ma trận truy vết."}, {"id": "2.3", "name": "Kiểm thử tự động đơn vị và component", "scope": "group", "max": 0.4, "levels": {"A": "Vitest/Testing Library cho logic và component chính chạy xanh; chứng minh test có giá trị bằng mutation thủ công.", "B": "Test tự động chạy xanh cho phần lớn logic chính; chưa kiểm chứng giá trị test.", "C": "Có vài test tự động, phủ ít logic quan trọng.", "D": "Không có test nce": "Biên bản Sprint Review/Retrospective; lịch sử review PR."}]}]};
const COURSE = RUBRIC.course;
const STORE_KEY = 'rubric-grading-' + COURSE.code;
const CRITERIA = RUBRIC.clos.flatMap((clo) => clo.criteria.map((c) => ({ ...c, clo })));
const DESCRIBED = RUBRIC.levels.filter((l) => l.code !== '0');
const SCOPE = { group: 'Nhóm', individual: 'Cá nhân' };
const CLO_STYLE = ['bg-blue-50 border-blue-200 text-blue-800', 'bg-emerald-50 border-emerald-200 text-emerald-800',
                   'bg-amber-50 border-amber-200 text-amber-800', 'bg-purple-50 border-purple-200 text-purple-800'];
const LEVEL_STYLE = { A: 'text-emerald-700 bg-emerald-50 border-emerald-200', B: 'text-sky-700 bg-sky-50 border-sky-200',
                      C: 'text-amber-700 bg-amber-50 border-amber-200', D: 'text-rose-700 bg-rose-50 border-rose-200',
                      '0': 'text-slate-600 bg-slate-100 border-slate-200' };

// ---------------------------------------------------------------- trạng thái và lưu trữ
const blank = () => ({ version: 1, students: [], groupScores: {}, selected: null });
let state = load();
let tab = 'grade';
let search = '';
const openDetails = new Set();

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    const data = raw ? JSON.parse(raw) : null;
    if (data && Array.isArray(data.students)) return { ...blank(), ...data };
  } catch { /* trình duyệt chặn lưu trữ: vẫn chấm được, nhớ xuất file */ }
  return blank();
}
function save() {
  const el = document.getElementById('saveState');
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    el.textContent = 'Đã lưu ' + new Date().toLocaleTimeString('vi-VN');
  } catch {
    el.textContent = 'Không lưu được trên trình duyệt: hãy xuất JSON sao lưu';
  }
}

// ---------------------------------------------------------------- tính điểm
const round2 = (v) => Math.round(v * 100) / 100;
const fmt = (v) => (v === null || v === undefined || v === '' ? '–' : Number(v).toLocaleString('vi-VN', { maximumFractionDigits: 2 }));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const usesGroup = (st, c) => c.scope === 'group' && st.group && !(st.overrides || {})[c.id];

function score(st, c) {
  const v = usesGroup(st, c) ? (state.groupScores[st.group] || {})[c.id] : (st.scores || {})[c.id];
  return v === undefined ? null : v;
}
function cloScore(st, clo) {
  const vals = clo.criteria.map((c) => score(st, CRITERIA.find((x) => x.id === c.id)));
  return vals.every((v) => v !== null) ? round2(vals.reduce((a, b) => a + b, 0)) : null;
}
function cloPartial(st, clo) {
  return round2(clo.criteria.reduce((a, c) => a + (score(st, CRITERIA.find((x) => x.id === c.id)) ?? 0), 0));
}
function total(st) {
  const vals = RUBRIC.clos.map((clo) => cloScore(st, clo));
  return vals.every((v) => v !== null) ? round2(vals.reduce((a, b) => a + b, 0)) : null;
}
const passed = (v, clo) => (v === null ? null : v >= clo.max * COURSE.studentThreshold - 1e-9);
const gradedCount = (st) => CRITERIA.filter((c) => score(st, c) !== null).length;
const groupSize = (g) => state.students.filter((s) => s.group === g).length;

function setScore(st, c, value) {
  const v = value === null || value === '' || Number.isNaN(value) ? null : round2(Math.min(c.max, Math.max(0, Number(value))));
  if (usesGroup(st, c)) {
    state.groupScores[st.group] = state.groupScores[st.group] || {};
    if (v === null) delete state.groupScores[st.group][c.id]; else state.groupScores[st.group][c.id] = v;
  } else {
    st.scores = st.scores || {};
    if (v === null) delete st.scores[c.id]; else st.scores[c.id] = v;
  }
  save();
  render();
}

function stats() {
  const clos = RUBRIC.clos.map((clo) => {
    const vals = state.students.map((s) => cloScore(s, clo)).filter((v) => v !== null);
    const pass = vals.filter((v) => passed(v, clo)).length;
    const rate = vals.length ? pass / vals.length : null;
    return { clo, n: vals.length, pass, rate, avg: vals.length ? round2(vals.reduce((a, b) => a + b, 0) / vals.length) : null,
             ok: rate === null ? null : rate >= COURSE.classThreshold - 1e-9 };
  });
  const crits = CRITERIA.map((c) => {
    const vals = state.students.map((s) => score(s, c)).filter((v) => v !== null);
    const avg = vals.length ? round2(vals.reduce((a, b) => a + b, 0) / vals.length) : null;
    return { c, n: vals.length, avg, ratio: avg === null ? null : avg / c.max };
  });
  return { clos, crits };
}

const TABS = [
  { id: 'grade', icon: 'fa-pen-to-square', label: 'Chấm điểm' },
  { id: 'report', icon: 'fa-chart-column', label: 'Mức đạt CLO' },
  { id: 'rubric', icon: 'fa-table-list', label: 'Rubric' },
  { id: 'data', icon: 'fa-users', label: 'Sinh viên & dữ liệu' },
];

// Thay innerHTML gỡ ô đang focus → blur → change → render lồng nhau. Chặn lồng, vẽ lại một lần sau.
let rendering = false, pendingRender = false;
function render() {
  if (rendering) { pendingRender = true; return; }
  rendering = true;
  try { draw(); } finally { rendering = false; }
  if (pendingRender) { pendingRender = false; render(); }
}

function draw() {
  document.getElementById('tabs').innerHTML = TABS.map((t) =>
    `<button data-action="tab" data-tab="${t.id}" class="px-4 py-2.5 border-b-2 whitespace-nowrap ${tab === t.id ? 'border-lhu-blue text-lhu-blue' : 'border-transparent text-slate-500 hover:text-slate-800'}"><i class="fa-solid ${t.icon} mr-1.5"></i>${t.label}</button>`).join('');
  const view = document.getElementById('view');
  view.innerHTML = { grade: viewGrade, report: viewReport, rubric: viewRubric, data: viewData }[tab]();
}

const badge = (text, cls) => `<span class="inline-flex items-center px-2 py-0.5 rounded-lg border text-[11px] font-bold ${cls}">${text}</span>`;
const passBadge = (p) => (p === null ? badge('Chưa đủ', 'bg-slate-50 border-slate-200 text-slate-500')
  : p ? badge('Đạt', 'bg-emerald-50 border-emerald-200 text-emerald-700') : badge('Chưa đạt', 'bg-rose-50 border-rose-200 text-rose-700'));

// ---------------------------------------------------------------- tab Chấm điểm
function viewGrade() {
  if (!state.students.length) {
    return `<div class="max-w-xl mx-auto text-center bg-white border border-slate-200 rounded-3xl p-10">
      <i class="fa-solid fa-users text-4xl text-slate-300"></i>
      <h2 class="mt-4 text-lg font-extrabold">Chưa có danh sách sinh viên</h2>
      <p class="mt-2 text-sm text-slate-500">Dán danh sách MSSV, họ tên, nhóm từ Excel hoặc nhập file CSV.</p>
      <button data-action="tab" data-tab="data" class="mt-5 px-5 py-2.5 bg-lhu-blue text-white font-bold rounded-xl">Nhập danh sách</button></div>`;
  }
  if (!state.students.some((s) => s.id === state.selected)) state.selected = state.students[0].id;
  const st = state.students.find((s) => s.id === state.selected);
  return `<div class="grid lg:grid-cols-[300px_1fr] gap-5">${sidebar()}${studentPanel(st)}</div>`;
}

function sidebar() {
  const q = search.trim().toLowerCase();
  const list = state.students.filter((s) => !q || `${s.mssv} ${s.name} ${s.group}`.toLowerCase().includes(q));
  const groups = [...new Set(list.map((s) => s.group || '(chưa có nhóm)'))].sort((a, b) => a.localeCompare(b, 'vi', { numeric: true }));
  return `<aside class="bg-white border border-slate-200 rounded-2xl p-3 lg:sticky lg:top-28 lg:max-h-[calc(100vh-8rem)] overflow-auto no-print">
    <input id="search" value="${esc(search)}" placeholder="Tìm MSSV, tên, nhóm…" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm mb-3">
    ${groups.map((g) => `<div class="mb-3"><div class="text-[11px] font-bold uppercase text-slate-400 px-1 mb-1">Nhóm ${esc(g)}</div>
      ${list.filter((s) => (s.group || '(chưa có nhóm)') === g).map((s) => {
        const t = total(s); const n = gradedCount(s);
        return `<button data-action="select" data-id="${s.id}" class="w-full text-left px-3 py-2 rounded-xl mb-1 flex items-center justify-between gap-2 ${s.id === state.selected ? 'bg-lhu-blue text-white' : 'hover:bg-slate-100'}">
          <span class="min-w-0"><span class="block text-sm font-bold truncate">${esc(s.name)}</span><span class="block text-[11px] opacity-70">${esc(s.mssv)}</span></span>
          <span class="text-xs font-extrabold whitespace-nowrap">${t !== null ? fmt(t) : `${n}/${CRITERIA.length}`}</span></button>`;
      }).join('')}</div>`).join('') || '<p class="text-sm text-slate-400 px-1">Không tìm thấy.</p>'}
  </aside>`;
}

function studentPanel(st) {
  const idx = state.students.indexOf(st);
  const t = total(st);
  const head = `<div class="bg-white border border-slate-200 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
    <div><div class="text-xs text-slate-500">${esc(st.mssv)} · Nhóm ${esc(st.group || '–')} (${st.group ? groupSize(st.group) : 1} SV)</div>
      <h2 class="text-xl font-extrabold">${esc(st.name)}</h2>
      <div class="mt-2 flex flex-wrap gap-1.5">${RUBRIC.clos.map((clo, k) => {
        const v = cloScore(st, clo);

      }).join(' ')}</div></div>
    <div class="text-right"><div class="text-xs text-slate-500">Tổng (${COURSE.scale})</div><div class="text-3xl font-black text-lhu-blue">${t !== null ? fmt(t) : '–'}</div>

      </div></div></div>`;
  const clos = RUBRIC.clos.map((clo, k) => `<section class="bg-white border border-slate-200 rounded-2xl overflow-hidden">

        <div class="text-xs mt-0.5">${esc(clo.name)}</div></div>
      <div class="p-3 space-y-3">${clo.criteria.map((c) => criterionRow(st, CRITERIA.find((x) => x.id === c.id))).join('')}</div></section>`).join('');

  return `<div class="space-y-4 min-w-0">${head}${clos}${note}</div>`;
}

function criterionRow(st, c) {
  const v = score(st, c);
  const viaGroup = usesGroup(st, c);
  const groupInfo = c.scope === 'group' && st.group
    ? `<label class="flex items-center gap-1.5 text-[11px] text-slate-500 no-print"><input type="checkbox" data-action="override" data-crit="${c.id}" ${viaGroup ? '' : 'checked'}> Chấm riêng cho SV này</label>
       <span class="text-[11px] ${viaGroup ? 'text-sky-700' : 'text-amber-700'}">${viaGroup ? `Điểm chung nhóm ${esc(st.group)} · áp dụng cho ${groupSize(st.group)} SV` : 'Điểm riêng (không theo nhóm)'}</span>` : '';
  const buttons = RUBRIC.levels.map((l) => {
    const pts = round2(c.max * l.ratio);
    const on = v !== null && Math.abs(v - pts) < 1e-9;
    return `<button data-action="level" data-crit="${c.id}" data-value="${pts}" aria-pressed="${on}" title="${esc(l.name)}${c.levels[l.code] ? ': ' + esc(c.levels[l.code]) : ''}"
      class="lv-btn px-2.5 py-1.5 rounded-lg border text-xs font-bold ${LEVEL_STYLE[l.code]} ${on ? '' : 'opacity-70 hover:opacity-100'}">${l.code} · ${fmt(pts)}</button>`;
  }).join('');
  const levelsText = DESCRIBED.map((l) => `<li><strong class="${LEVEL_STYLE[l.code].split(' ')[0]}">${l.code} - ${esc(l.name)} (${fmt(round2(c.max * l.ratio))}):</strong> ${esc(c.levels[l.code])}</li>`).join('');
  return `<div class="border border-slate-200 rounded-xl p-3 ${v === null ? '' : 'bg-slate-50/60'}">
    <div class="flex flex-wrap items-start justify-between gap-2">
      <div class="min-w-0"><div class="font-bold text-sm">${c.id}. ${esc(c.name)}</div>
        <div class="flex flex-wrap items-center gap-2 mt-1">${badge(SCOPE[c.scope], c.scope === 'group' ? 'bg-sky-50 border-sky-200 text-sky-700' : 'bg-amber-50 border-amber-200 text-amber-700')}
          <span class="text-[11px] text-slate-500">Tối đa ${fmt(c.max)}</span>${groupInfo}</div></div>
      <div class="flex items-center gap-1.5">
        <input type="number" data-input="score" data-crit="${c.id}" value="${v ?? ''}" min="0" max="${c.max}" step="0.05" class="w-20 px-2 py-1.5 border border-slate-300 rounded-lg text-sm font-bold text-right" aria-label="Điểm ${c.id}">
        <button data-action="clear" data-crit="${c.id}" class="px-2 py-1.5 text-slate-400 hover:text-rose-600 no-print" title="Xóa điểm"><i class="fa-solid fa-xmark"></i></button>
      </div></div>
    <div class="flex flex-wrap gap-1.5 mt-2 no-print">${buttons}</div>
    <details data-crit="${c.id}" class="mt-2 text-xs" ${openDetails.has(c.id) ? 'open' : ''}>
      <summary class="text-lhu-blue font-bold"><i class="fa-solid fa-circle-info mr-1"></i>Mô tả mức · Gợi ý chấm · Minh chứng</summary>
      <ul class="mt-2 space-y-1 text-slate-600">${levelsText}</ul>
      <p class="mt-2"><strong>Gợi ý chấm:</strong> ${esc(c.guide)}</p>
      <p class="mt-1"><strong>Minh chứng cần có:</strong> ${esc(c.evidence)}</p>
    </details></div>`;
}

function parseStudents(text) {
  let added = 0, updated = 0;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line || /mssv/i.test(line)) continue;
    const parts = line.split(line.includes('\t') ? '\t' : /[;,]/).map((p) => p.trim().replace(/^"|"$/g, ''));
    const [mssv, name, group = ''] = parts;
    if (!mssv || !name) continue;
    const found = state.students.find((s) => s.mssv === mssv);
    if (found) { found.name = name; found.group = group; updated++; continue; }
    state.students.push({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()), mssv, name, group, scores: {}, overrides: {}, note: '' });
    added++;
  }
  save();
  return { added, updated };
}

// ---------------------------------------------------------------- xuất file
function download(name, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const stamp = () => new Date().toISOString().slice(0, 10);

function gradeTable() {
  const head = ['STT', 'MSSV', 'Họ và tên', 'Nhóm', ...CRITERIA.map((c) => `${c.id} ${c.name} (${c.max})`),
    ...RUBRIC.clos.map((c) => `${c.id} (${c.max})`), `Tổng (${COURSE.scale})`, ...RUBRIC.clos.map((c) => `Đạt ${c.id}`), 'Ghi chú'];
  const rows = state.students.map((s, i) => [i + 1, s.mssv, s.name, s.group, ...CRITERIA.map((c) => score(s, c) ?? ''),
    ...RUBRIC.clos.map((clo) => cloScore(s, clo) ?? ''), total(s) ?? '',
    ...RUBRIC.clos.map((clo) => { const p = passed(cloScore(s, clo), clo); return p === null ? '' : p ? 'Đạt' : 'Chưa đạt'; }), s.note || '']);
  return [head, ...rows];
}

function exportXlsx() {
  if (!state.students.length) return alert('Chưa có sinh viên để xuất.');
  const table = gradeTable();
  if (typeof XLSX === 'undefined') {
    // Không tải được thư viện (mất mạng): xuất CSV mở được bằng Excel
    const csv = '﻿' + table.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
    return download(`Diem-${COURSE.code}-${stamp()}.csv`, new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  }
  const { clos, crits } = stats();
  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.aoa_to_sheet(table);
  ws1['!cols'] = [{ wch: 5 }, { wch: 12 }, { wch: 24 }, { wch: 7 }, ...CRITERIA.map(() => ({ wch: 12 })), ...RUBRIC.clos.map(() => ({ wch: 10 })), { wch: 10 }, ...RUBRIC.clos.map(() => ({ wch: 10 })), { wch: 30 }];
  ws1['!freeze'] = { xSplit: 4, ySplit: 1 };
  XLSX.utils.book_append_sheet(wb, ws1, 'Bảng điểm');

  const ws2 = XLSX.utils.aoa_to_sheet([
    [`Mức đạt CLO - ${COURSE.name} (${COURSE.code}) - xuất ngày ${new Date().toLocaleDateString('vi-VN')}`], [COURSE.note], [],
    ['CLO', 'Nội dung', 'PLO/PI', 'Điểm tối đa', 'Ngưỡng SV đạt', 'Số SV có điểm', 'Số SV đạt', 'Tỷ lệ đạt (%)', 'Điểm TB', 'Kết luận cấp lớp'],
    ...clos.map((s) => [s.clo.id, s.clo.name, s.clo.plo, s.clo.max, round2(s.clo.max * COURSE.studentThreshold), s.n, s.pass,
      s.rate === null ? '' : round2(s.rate * 100), s.avg ?? '', s.ok === null ? '' : s.ok ? 'Đạt' : 'Chưa đạt']),
  ]);
  ws2['!cols'] = [{ wch: 8 }, { wch: 60 }, { wch: 14 }, { wch: 11 }, { wch: 13 }, { wch: 13 }, { wch: 10 }, { wch: 13 }, { wch: 9 }, { wch: 16 }];
  XLSX.utils.book_append_sheet(wb, ws2, 'Mức đạt CLO');

  const ws3 = XLSX.utils.aoa_to_sheet([
    ['Mã', 'Tiêu chí', 'CLO', 'Phạm vi', 'Điểm tối đa', 'Số SV có điểm', 'Điểm TB', 'TB / tối đa (%)'],
    ...crits.map(({ c, n, avg, ratio }) => [c.id, c.name, c.clo.id, SCOPE[c.scope], c.max, n, avg ?? '', ratio === null ? '' : round2(ratio * 100)]),
  ]);
  ws3['!cols'] = [{ wch: 6 }, { wch: 45 }, { wch: 7 }, { wch: 9 }, { wch: 11 }, { wch: 13 }, { wch: 9 }, { wch: 14 }];
  XLSX.utils.book_append_sheet(wb, ws3, 'Theo tiêu chí');

  const ws4 = XLSX.utils.aoa_to_sheet([
    ['Mã', 'CLO', 'Tiêu chí', 'Phạm vi', 'Điểm tối đa', ...DESCRIBED.map((l) => `${l.code} - ${l.name} (${l.ratio * 100}%)`), 'Gợi ý chấm', 'Minh chứng cần có'],
    ...CRITERIA.map((c) => [c.id, c.clo.id, c.name, SCOPE[c.scope], c.max, ...DESCRIBED.map((l) => c.levels[l.code]), c.guide, c.evidence]),
  ]);
  ws4['!cols'] = [{ wch: 6 }, { wch: 7 }, { wch: 28 }, { wch: 9 }, { wch: 9 }, ...DESCRIBED.map(() => ({ wch: 40 })), { wch: 45 }, { wch: 40 }];
  XLSX.utils.book_append_sheet(wb, ws4, 'Rubric');

  XLSX.writeFile(wb, `Diem-${COURSE.code}-${stamp()}.xlsx`);
}

  const el = e.target.closest('[data-action]');
  if (!el) return;
  const st = state.students.find((s) => s.id === state.selected);
  const crit = el.dataset.crit && CRITERIA.find((c) => c.id === el.dataset.crit);
  switch (el.dataset.action) {
    case 'tab': tab = el.dataset.tab; render(); window.scrollTo(0, 0); break;
    case 'select': state.selected = el.dataset.id; save(); render(); window.scrollTo(0, 0); break;
    case 'move': {
      const i = state.students.indexOf(st) + Number(el.dataset.step);
      if (state.students[i]) { state.selected = state.students[i].id; save(); render(); window.scrollTo(0, 0); }
      break;
    }
    case 'level': setScore(st, crit, Number(el.dataset.value)); break;
    case 'clear': setScore(st, crit, null); break;
    case 'override': {
      st.overrides = st.overrides || {};
      if (el.checked) {
        st.overrides[crit.id] = true;
        // Bắt đầu chấm riêng từ điểm nhóm hiện có
        const g = (state.groupScores[st.group] || {})[crit.id];
        if (g !== undefined && (st.scores || {})[crit.id] === undefined) { st.scores = st.scores || {}; st.scores[crit.id] = g; }
      } else {
        delete st.overrides[crit.id];
        if (st.scores) delete st.scores[crit.id];
      }
      save(); render(); break;
    }
    case 'paste': {
      const box = document.getElementById('paste');
      const r = parseStudents(box.value);
      box.value = '';
      render();
      alert(`Đã thêm ${r.added} sinh viên, cập nhật ${r.updated} sinh viên.`);
      break;
    }
    case 'remove': {
      const s = state.students.find((x) => x.id === el.dataset.id);
      if (s && confirm(`Xóa ${s.name} (${s.mssv}) và điểm đã chấm?`)) { state.students = state.students.filter((x) => x !== s); save(); render(); }
      break;
    }
    case 'export-xlsx': exportXlsx(); break;
    case 'export-json':
      download(`Cham-diem-${COURSE.code}-${stamp()}.json`, new Blob([JSON.stringify({ ...state, course: COURSE.code, exportedAt: new Date().toISOString() }, null, 2)], { type: 'application/json' }));
      break;
    case 'reset':
      if (confirm('Xóa toàn bộ danh sách và điểm đã chấm trên trình duyệt này? Nên sao lưu JSON trước.')) { state = blank(); save(); render(); }
      break;
  }
});

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'search') {
    search = el.value;
    const pos = el.selectionStart;
    render();
    const box = document.getElementById('search');
    box.focus(); box.setSelectionRange(pos, pos);
    return;
  }
  if (el.dataset.input === 'note') {
    const st = state.students.find((s) => s.id === state.selected);
    st.note = el.value; save();
  }
  if (el.dataset.edit) {
    const s = state.students.find((x) => x.id === el.dataset.id);
    s[el.dataset.edit] = el.value.trim(); save();
  }
});

document.addEventListener('change', async (e) => {
  const el = e.target;
  if (el.dataset.input === 'score') {
    const st = state.students.find((s) => s.id === state.selected);
    const crit = CRITERIA.find((c) => c.id === el.dataset.crit);
    if (!st || !crit) return;
    const next = el.value === '' ? null : Number(el.value.replace(',', '.'));
    if (next !== score(st, crit)) setScore(st, crit, next);
  }
  if (el.dataset.edit) render();
  if (el.dataset.input === 'csv' && el.files[0]) {
    const r = parseStudents(await el.files[0].text());
    render();
    alert(`Đã thêm ${r.added} sinh viên, cập nhật ${r.updated} sinh viên.`);
  }
  if (el.dataset.input === 'json' && el.files[0]) {
    try {
      const data = JSON.parse(await el.files[0].text());
      if (!Array.isArray(data.students)) throw new Error('Thiếu danh sách students');
      if (data.course && data.course !== COURSE.code && !confirm(`File thuộc học phần ${data.course}, vẫn khôi phục?`)) return;
      state = { ...blank(), students: data.students, groupScores: data.groupScores || {}, selected: data.selected || null };
      save(); render();
      alert(`Đã khôi phục ${state.students.length} sinh viên.`);
    } catch (err) {
      alert('File JSON không hợp lệ: ' + err.message);
    }
  }
});

document.addEventListener('toggle', (e) => {
  const d = e.target;
  if (d.tagName === 'DETAILS' && d.dataset.crit) { d.open ? openDetails.add(d.dataset.crit) : openDetails.delete(d.dataset.crit); }
}, true);

render();
</script>
</body>
</html>
