const COURSE = RUBRIC.course;
const STORE_KEY = 'rubric-components-' + COURSE.code;
const COMPS = RUBRIC.components;
const CRITERIA = COMPS.flatMap((comp) => comp.criteria.map((c) => ({ ...c, comp })));
const RULES = RUBRIC.rules || [];
const CLO_MAX = RUBRIC.cloMax;
const SCOPE = { group: 'Nhóm', individual: 'Cá nhân' };
const COMP_STYLE = ['bg-blue-50 border-blue-200 text-blue-800', 'bg-emerald-50 border-emerald-200 text-emerald-800',
                    'bg-amber-50 border-amber-200 text-amber-800', 'bg-purple-50 border-purple-200 text-purple-800'];
const LEVEL_STYLE = { XS: 'text-emerald-700 bg-emerald-50 border-emerald-200', T: 'text-sky-700 bg-sky-50 border-sky-200',
                      D: 'text-amber-700 bg-amber-50 border-amber-200', CD: 'text-rose-700 bg-rose-50 border-rose-200' };
const LEVELS_DESC = [...RUBRIC.levels].reverse();

// ---------------------------------------------------------------- trạng thái và lưu trữ
const blank = () => ({ version: 1, students: [], groupScores: {}, groupFlags: {}, selected: null, comp: COMPS[0].id });
let state = load();
let tab = 'grade';
let search = '';
const openDetails = new Set();

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    const data = raw ? JSON.parse(raw) : null;
    if (data && Array.isArray(data.students)) return { ...blank(), ...data };
  } catch { /* trình duyệt chặn lưu trữ: vẫn chấm được, nhớ xuất file */ }
  return blank();
}
function save() {
  const el = document.getElementById('saveState');
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    el.textContent = 'Đã lưu ' + new Date().toLocaleTimeString('vi-VN');
  } catch {
    el.textContent = 'Không lưu được trên trình duyệt: hãy xuất JSON sao lưu';
  }
}

// ---------------------------------------------------------------- tính điểm
const round2 = (v) => Math.round(v * 100) / 100;
const fmt = (v) => (v === null || v === undefined || v === '' ? '–' : Number(v).toLocaleString('vi-VN', { maximumFractionDigits: 2 }));
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const pctText = (w) => `${round2(w * 100)}%`;
const usesGroup = (st, c) => c.scope === 'group' && st.group && !(st.overrides || {})[c.id];
const cloText = (c) => Object.entries(c.clo || {}).map(([k, w]) => `${k} (${fmt(w)})`).join(' + ') || 'Không gắn CLO';

function coef(st, c) {
  const v = usesGroup(st, c) ? (state.groupScores[st.group] || {})[c.id] : (st.scores || {})[c.id];
  return v === undefined ? null : v;
}
function flagged(st, rule) {
  return rule.scope === 'group' && st.group ? !!(state.groupFlags[st.group] || {})[rule.id] : !!(st.flags || {})[rule.id];
}
function capOf(st, c) {
  return RULES.filter((r) => r.cap.criteria.includes(c.id) && flagged(st, r)).reduce((m, r) => Math.min(m, r.cap.max), 1);
}
function eff(st, c) {
  const v = coef(st, c);
  return v === null ? null : Math.min(v, capOf(st, c));
}
function compScore(st, comp) {
  const vals = comp.criteria.map((c) => eff(st, CRITERIA.find((x) => x.id === c.id)));
  return vals.every((v) => v !== null) ? round2(comp.criteria.reduce((a, c, i) => a + c.weight * vals[i], 0)) : null;
}
function compPartial(st, comp) {
  return round2(comp.criteria.reduce((a, c) => a + c.weight * (eff(st, CRITERIA.find((x) => x.id === c.id)) ?? 0), 0));
}
function courseScore(st) {
  const vals = COMPS.map((comp) => compScore(st, comp));
  return vals.every((v) => v !== null) ? round2(COMPS.reduce((a, comp, i) => a + comp.weight * vals[i], 0)) : null;
}
function cloScore(st, cloId) {
  if (COMPS.some((comp) => compScore(st, comp) === null)) return null;
  return round2(CRITERIA.reduce((a, c) => a + c.comp.weight * ((c.clo || {})[cloId] || 0) * eff(st, c), 0));
}
const passed = (v, cloId) => (v === null ? null : v >= CLO_MAX[cloId] * COURSE.studentThreshold - 1e-9);
const gradedCount = (st, comp) => (comp ? comp.criteria : CRITERIA).filter((c) => coef(st, CRITERIA.find((x) => x.id === c.id)) !== null).length;
const groupSize = (g) => state.students.filter((s) => s.group === g).length;

function setCoef(st, c, value) {
  const v = value === null || value === '' || Number.isNaN(value) ? null : round2(Math.min(1, Math.max(0, Number(value))));
  if (usesGroup(st, c)) {
    state.groupScores[st.group] = state.groupScores[st.group] || {};
    if (v === null) delete state.groupScores[st.group][c.id]; else state.groupScores[st.group][c.id] = v;
  } else {
    st.scores = st.scores || {};
    if (v === null) delete st.scores[c.id]; else st.scores[c.id] = v;
  }
  save();
  render();
}
function setFlag(st, rule, on) {
  if (rule.scope === 'group' && st.group) {
    state.groupFlags[st.group] = state.groupFlags[st.group] || {};
    if (on) state.groupFlags[st.group][rule.id] = true; else delete state.groupFlags[st.group][rule.id];
  } else {
    st.flags = st.flags || {};
    if (on) st.flags[rule.id] = true; else delete st.flags[rule.id];
  }
  save();
  render();
}

function stats() {
  const clos = RUBRIC.clos.map((clo) => {
    const vals = state.students.map((s) => cloScore(s, clo.id)).filter((v) => v !== null);
    const pass = vals.filter((v) => passed(v, clo.id)).length;
    const rate = vals.length ? pass / vals.length : null;
    return { clo, n: vals.length, pass, rate, avg: vals.length ? round2(vals.reduce((a, b) => a + b, 0) / vals.length) : null,
             ok: rate === null ? null : rate >= COURSE.classThreshold - 1e-9 };
  });
  const comps = COMPS.map((comp) => {
    const vals = state.students.map((s) => compScore(s, comp)).filter((v) => v !== null);
    return { comp, n: vals.length, avg: vals.length ? round2(vals.reduce((a, b) => a + b, 0) / vals.length) : null };
  });
  const crits = CRITERIA.map((c) => {
    const vals = state.students.map((s) => eff(s, c)).filter((v) => v !== null);
    const avg = vals.length ? round2(vals.reduce((a, b) => a + b, 0) / vals.length) : null;
    return { c, n: vals.length, avg };
  });
  return { clos, comps, crits };
}

// Thay innerHTML gỡ ô đang focus → blur → change → render lồng nhau. Chặn lồng, vẽ lại một lần sau.
let rendering = false, pendingRender = false;
function render() {
  if (rendering) { pendingRender = true; return; }
  rendering = true;
  try { draw(); } finally { rendering = false; }
  if (pendingRender) { pendingRender = false; render(); }
}

function draw() {
  document.getElementById('tabs').innerHTML = TABS.map((t) =>
    `<button data-action="tab" data-tab="${t.id}" class="px-4 py-2.5 border-b-2 whitespace-nowrap ${tab === t.id ? 'border-lhu-blue text-lhu-blue' : 'border-transparent text-slate-500 hover:text-slate-800'}"><i class="fa-solid ${t.icon} mr-1.5"></i>${t.label}</button>`).join('');
  document.getElementById('view').innerHTML = { grade: viewGrade, report: viewReport, rubric: viewRubric, data: viewData }[tab]();
}

const passBadge = (p) => (p === null ? badge('Chưa đủ', 'bg-slate-50 border-slate-200 text-slate-500')

// ---------------------------------------------------------------- tab Chấm điểm
function viewGrade() {
  if (!state.students.length) {

  if (!state.students.some((s) => s.id === state.selected)) state.selected = state.students[0].id;

function sidebar() {
  const q = search.trim().toLowerCase();
  const comp = COMPS.find((c) => c.id === state.comp);
  const list = state.students.filter((s) => !q || `${s.mssv} ${s.name} ${s.group}`.toLowerCase().includes(q));

    ${groups.map((g) => `<div class="mb-3"><div class="text-[11px] font-bold uppercase text-slate-400 px-1 mb-1">Nhóm ${esc(g)}</div>

      }).join('')}</div>`).join('') || '<p class="text-sm text-slate-400 px-1">Không tìm thấy.</p>'}
  </aside>`;
}

function studentPanel(st) {
  const idx = state.students.indexOf(st);

  const compTabs = `<div class="flex flex-wrap gap-2 no-print">${COMPS.map((c, i) => `<button data-action="comp" data-comp="${c.id}" class="px-4 py-2 rounded-xl border text-sm font-bold ${c.id === comp.id ? COMP_STYLE[i % 4] + ' ring-2 ring-offset-1 ring-current' : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'}">${c.id}. ${esc(c.name)} · ${pctText(c.weight)} <span class="font-normal">(${gradedCount(st, c)}/${c.criteria.length})</span></button>`).join('')}</div>`;
  const rules = RULES.filter((r) => r.component === comp.id).map((r) => `<label class="flex items-start gap-2 p-3 rounded-xl border border-rose-200 bg-rose-50 text-sm text-rose-800">
      <input type="checkbox" data-action="flag" data-rule="${r.id}" ${flagged(st, r) ? 'checked' : ''} class="mt-1">
      <span><strong>${esc(r.label)}</strong><br><span class="text-xs">Khi đánh dấu: tiêu chí ${r.cap.criteria.map((id) => esc(CRITERIA.find((c) => c.id === id).label)).join(', ')} tối đa hệ số ${fmt(r.cap.max)}${r.scope === 'group' && st.group ? ` · áp dụng cho cả nhóm ${esc(st.group)}` : ''}.</span></span></label>`).join('');
  const section = `<section class="bg-white border border-slate-200 rounded-2xl overflow-hidden">
      <div class="px-4 py-3 border-b ${COMP_STYLE[k % 4]}"><div class="font-extrabold">${comp.id}. ${esc(comp.name)} · ${pctText(comp.weight)} điểm học phần · thang ${COURSE.scale}</div>
        <div class="text-xs mt-0.5">${esc(comp.when || '')}</div></div>
      <div class="p-3 space-y-3">${rules}${comp.criteria.map((c) => criterionRow(st, CRITERIA.find((x) => x.id === c.id))).join('')}</div></section>`;
  const note = `<div class="bg-white border border-slate-200 rounded-2xl p-4"><label class="text-sm font-bold">Ghi chú cho sinh viên</label>
    <textarea data-input="note" rows="2" class="mt-2 w-full px-3 py-2 border border-slate-200 rounded-xl text-sm" placeholder="Nhận xét, minh chứng còn thiếu…">${esc(st.note || '')}</textarea></div>`;
  return `<div class="space-y-4 min-w-0">${head}${compTabs}${section}${note}</div>`;
}

function criterionRow(st, c) {
  const v = coef(st, c);
  const cap = capOf(st, c);
  const e = eff(st, c);
  const viaGroup = usesGroup(st, c);
  const groupInfo = c.scope === 'group' && st.group
    ? `<label class="flex items-center gap-1.5 text-[11px] text-slate-500 no-print"><input type="checkbox" data-action="override" data-crit="${c.id}" ${viaGroup ? '' : 'checked'}> Chấm riêng cho SV này</label>
       <span class="text-[11px] ${viaGroup ? 'text-sky-700' : 'text-amber-700'}">${viaGroup ? `Hệ số chung nhóm ${esc(st.group)} · ${groupSize(st.group)} SV` : 'Hệ số riêng (không theo nhóm)'}</span>` : '';
  const buttons = [{ code: 'CD', name: 'Không có', value: 0 }, ...RUBRIC.levels.map((l) => ({ ...l, value: l.max }))].map((l) => {
    const on = v !== null && Math.abs(v - l.value) < 1e-9;
    const range = l.min === undefined ? '0' : `${fmt(l.min)}–${fmt(l.max)}`;
    return `<button data-action="level" data-crit="${c.id}" data-value="${l.value}" aria-pressed="${on}" title="${esc(l.name)}${c.levels[l.code] && l.min !== undefined ? ': ' + esc(c.levels[l.code]) : ''}"
      class="lv-btn px-2.5 py-1.5 rounded-lg border text-xs font-bold ${LEVEL_STYLE[l.code]} ${on ? '' : 'opacity-70 hover:opacity-100'}">${esc(l.name)} · ${range}</button>`;
  }).join('');
  const levelsText = LEVELS_DESC.map((l) => `<li><strong class="${LEVEL_STYLE[l.code].split(' ')[0]}">${esc(l.name)} (${fmt(l.min)}–${fmt(l.max)}):</strong> ${esc(c.levels[l.code])}</li>`).join('');
  return `<div class="border border-slate-200 rounded-xl p-3 ${v === null ? '' : 'bg-slate-50/60'}">
    <div class="flex flex-wrap items-start justify-between gap-2">
      <div class="min-w-0"><div class="font-bold text-sm">${esc(c.label)}. ${esc(c.name)}</div>
        <div class="flex flex-wrap items-center gap-2 mt-1">${badge(SCOPE[c.scope], c.scope === 'group' ? 'bg-sky-50 border-sky-200 text-sky-700' : 'bg-amber-50 border-amber-200 text-amber-700')}
          <span class="text-[11px] text-slate-500">Trọng số ${fmt(c.weight)} · ${esc(cloText(c))}</span>${groupInfo}</div>
        ${cap < 1 ? `<div class="mt-1 text-[11px] font-bold text-rose-700"><i class="fa-solid fa-triangle-exclamation mr-1"></i>Bị giới hạn tối đa hệ số ${fmt(cap)} do vi phạm</div>` : ''}</div>
      <div class="flex items-center gap-1.5">
        <input type="number" data-input="score" data-crit="${c.id}" value="${v ?? ''}" min="0" max="1" step="0.05" class="w-20 px-2 py-1.5 border border-slate-300 rounded-lg text-sm font-bold text-right" aria-label="Hệ số ${esc(c.label)}">
        <span class="text-xs text-slate-500 w-20 text-right">= ${e === null ? '–' : fmt(round2(e * c.weight))} / ${fmt(c.weight)}</span>
        <button data-action="clear" data-crit="${c.id}" class="px-2 py-1.5 text-slate-400 hover:text-rose-600 no-print" title="Xóa điểm"><i class="fa-solid fa-xmark"></i></button>
      </div></div>
    <div class="flex flex-wrap gap-1.5 mt-2 no-print">${buttons}</div>
    <details data-crit="${c.id}" class="mt-2 text-xs" ${openDetails.has(c.id) ? 'open' : ''}>
      <summary class="text-lhu-blue font-bold"><i class="fa-solid fa-circle-info mr-1"></i>Mô tả mức · Gợi ý chấm · Minh chứng</summary>
      <ul class="mt-2 space-y-1 text-slate-600">${levelsText}</ul>
      <p class="mt-2"><strong>Gợi ý chấm:</strong> ${esc(c.guide)}</p>
      <p class="mt-1"><strong>Minh chứng cần có:</strong> ${esc(c.evidence)}</p>
    </details></div>`;
}

function parseStudents(text) {
  let added = 0, updated = 0;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line || /mssv/i.test(line)) continue;
    const parts = line.split(line.includes('\t') ? '\t' : /[;,]/).map((p) => p.trim().replace(/^"|"$/g, ''));
    const [mssv, name, group = ''] = parts;
    if (!mssv || !name) continue;
    const found = state.students.find((s) => s.mssv === mssv);
    if (found) { found.name = name; found.group = group; updated++; continue; }
    state.students.push({ id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()), mssv, name, group, scores: {}, overrides: {}, flags: {}, note: '' });
    added++;
  }
  save();
  return { added, updated };
}

// ---------------------------------------------------------------- xuất file
function download(name, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const stamp = () => new Date().toISOString().slice(0, 10);

function gradeTable() {
  const head = ['STT', 'MSSV', 'Họ và tên', 'Nhóm',
    ...CRITERIA.map((c) => `${c.comp.id}.${c.label} ${c.name} (×${c.weight})`),
    ...RULES.map((r) => `Vi phạm: ${r.label}`),
    ...COMPS.map((c) => `${c.id} ${c.name} (/${COURSE.scale})`), `Điểm học phần (/${COURSE.scale})`,
    ...RUBRIC.clos.map((c) => `${c.id} (/${CLO_MAX[c.id]})`), ...RUBRIC.clos.map((c) => `Đạt ${c.id}`), 'Ghi chú'];
  const rows = state.students.map((s, i) => [i + 1, s.mssv, s.name, s.group,
    ...CRITERIA.map((c) => coef(s, c) ?? ''),
    ...RULES.map((r) => (flagged(s, r) ? 'x' : '')),
    ...COMPS.map((comp) => compScore(s, comp) ?? ''), courseScore(s) ?? '',
    ...RUBRIC.clos.map((clo) => cloScore(s, clo.id) ?? ''),
    ...RUBRIC.clos.map((clo) => { const p = passed(cloScore(s, clo.id), clo.id); return p === null ? '' : p ? 'Đạt' : 'Chưa đạt'; }), s.note || '']);
  return [head, ...rows];
}

function exportXlsx() {
  if (!state.students.length) return alert('Chưa có sinh viên để xuất.');
  const table = gradeTable();
  if (typeof XLSX === 'undefined') {
    // Không tải được thư viện (mất mạng): xuất CSV mở được bằng Excel
    const csv = '﻿' + table.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
    return download(`Diem-${COURSE.code}-${stamp()}.csv`, new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  }
  const { clos, comps, crits } = stats();
  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.aoa_to_sheet(table);
  ws1['!cols'] = table[0].map((_, i) => ({ wch: i === 2 ? 24 : i < 4 ? 10 : 12 }));
  XLSX.utils.book_append_sheet(wb, ws1, 'Bảng điểm');

  const ws2 = XLSX.utils.aoa_to_sheet([
    [`Tổng hợp - ${COURSE.name} (${COURSE.code}) - xuất ngày ${new Date().toLocaleDateString('vi-VN')}`], [COURSE.note], [],
    ['Thành phần', 'Tên', 'Tỷ trọng', 'Số SV chấm đủ', 'Điểm TB'],
    ...comps.map((s) => [s.comp.id, s.comp.name, pctText(s.comp.weight), s.n, s.avg ?? '']), [],
    ['CLO', 'Nội dung', 'Điểm tối đa', 'Ngưỡng SV đạt', 'Số SV có điểm', 'Số SV đạt', 'Tỷ lệ đạt (%)', 'Điểm TB', 'Kết luận cấp lớp'],
    ...clos.map((s) => [s.clo.id, s.clo.name, CLO_MAX[s.clo.id], round2(CLO_MAX[s.clo.id] * COURSE.studentThreshold), s.n, s.pass,
      s.rate === null ? '' : round2(s.rate * 100), s.avg ?? '', s.ok === null ? '' : s.ok ? 'Đạt' : 'Chưa đạt']),
  ]);
  ws2['!cols'] = [{ wch: 10 }, { wch: 60 }, { wch: 11 }, { wch: 13 }, { wch: 13 }, { wch: 10 }, { wch: 13 }, { wch: 9 }, { wch: 16 }];
  XLSX.utils.book_append_sheet(wb, ws2, 'Mức đạt CLO');

  const ws3 = XLSX.utils.aoa_to_sheet([
    ['Thành phần', 'Mã', 'Tiêu chí', 'CLO', 'Phạm vi', 'Trọng số', 'Số SV', 'Hệ số TB'],
    ...crits.map(({ c, n, avg }) => [c.comp.id, c.label, c.name, cloText(c), SCOPE[c.scope], c.weight, n, avg ?? '']),
  ]);
  ws3['!cols'] = [{ wch: 10 }, { wch: 6 }, { wch: 50 }, { wch: 18 }, { wch: 9 }, { wch: 9 }, { wch: 8 }, { wch: 9 }];
  XLSX.utils.book_append_sheet(wb, ws3, 'Theo tiêu chí');

  const ws4 = XLSX.utils.aoa_to_sheet([
    ['Thành phần', 'Mã', 'Tiêu chí', 'CLO', 'Phạm vi', 'Trọng số', ...RUBRIC.levels.map((l) => `${l.name} (${l.min}–${l.max})`), 'Gợi ý chấm', 'Minh chứng'],
    ...CRITERIA.map((c) => [c.comp.id, c.label, c.name, cloText(c), SCOPE[c.scope], c.weight, ...RUBRIC.levels.map((l) => c.levels[l.code]), c.guide, c.evidence]),
  ]);
  ws4['!cols'] = [{ wch: 10 }, { wch: 6 }, { wch: 32 }, { wch: 16 }, { wch: 9 }, { wch: 9 }, ...RUBRIC.levels.map(() => ({ wch: 34 })), { wch: 40 }, { wch: 34 }];
  XLSX.utils.book_append_sheet(wb, ws4, 'Rubric');

  XLSX.writeFile(wb, `Diem-${COURSE.code}-${stamp()}.xlsx`);
}

// ---------------------------------------------------------------- sự kiện
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const st = state.students.find((s) => s.id === state.selected);
  const crit = el.dataset.crit && CRITERIA.find((c) => c.id === el.dataset.crit);
  switch (el.dataset.action) {
    case 'tab': tab = el.dataset.tab; render(); window.scrollTo(0, 0); break;
    case 'comp': state.comp = el.dataset.comp; save(); render(); break;
    case 'select': state.selected = el.dataset.id; save(); render(); window.scrollTo(0, 0); break;
    case 'move': {
      const i = state.students.indexOf(st) + Number(el.dataset.step);
      if (state.students[i]) { state.selected = state.students[i].id; save(); render(); window.scrollTo(0, 0); }
      break;
    }
    case 'level': setCoef(st, crit, Number(el.dataset.value)); break;
    case 'clear': setCoef(st, crit, null); break;
    case 'flag': setFlag(st, RULES.find((r) => r.id === el.dataset.rule), el.checked); break;
    case 'override': {
      st.overrides = st.overrides || {};
      if (el.checked) {
        st.overrides[crit.id] = true;
        // Bắt đầu chấm riêng từ hệ số nhóm hiện có
        const g = (state.groupScores[st.group] || {})[crit.id];
        if (g !== undefined && (st.scores || {})[crit.id] === undefined) { st.scores = st.scores || {}; st.scores[crit.id] = g; }
      } else {
        delete st.overrides[crit.id];
        if (st.scores) delete st.scores[crit.id];
      }
      save(); render(); break;
    }
    case 'paste': {
      const box = document.getElementById('paste');
      const r = parseStudents(box.value);
      box.value = '';
      render();
      alert(`Đã thêm ${r.added} sinh viên, cập nhật ${r.updated} sinh viên.`);
      break;
    }
    case 'remove': {
      const s = state.students.find((x) => x.id === el.dataset.id);
      if (s && confirm(`Xóa ${s.name} (${s.mssv}) và điểm đã chấm?`)) { state.students = state.students.filter((x) => x !== s); save(); render(); }
      break;
    }
    case 'export-xlsx': exportXlsx(); break;
    case 'export-json':
      download(`Cham-diem-${COURSE.code}-${stamp()}.json`, new Blob([JSON.stringify({ ...state, course: COURSE.code, exportedAt: new Date().toISOString() }, null, 2)], { type: 'application/json' }));
      break;
    case 'reset':
      if (confirm('Xóa toàn bộ danh sách và điểm đã chấm trên trình duyệt này? Nên sao lưu JSON trước.')) { state = blank(); save(); render(); }
      break;
  }
});

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'search') {
    search = el.value;
    const pos = el.selectionStart;
    render();
    const box = document.getElementById('search');
    box.focus(); box.setSelectionRange(pos, pos);
    return;
  }
  if (el.dataset.input === 'note') {
    const st = state.students.find((s) => s.id === state.selected);
    st.note = el.value; save();
  }
  if (el.dataset.edit) {
    const s = state.students.find((x) => x.id === el.dataset.id);
    s[el.dataset.edit] = el.value.trim(); save();
  }
});

document.addEventListener('change', async (e) => {
  const el = e.target;
  if (el.dataset.input === 'score') {
    const st = state.students.find((s) => s.id === state.selected);
    const crit = CRITERIA.find((c) => c.id === el.dataset.crit);
    if (!st || !crit) return;
    const next = el.value === '' ? null : Number(el.value.replace(',', '.'));
    if (next !== coef(st, crit)) setCoef(st, crit, next);
  }
  if (el.dataset.edit) render();
  if (el.dataset.input === 'csv' && el.files[0]) {
    const r = parseStudents(await el.files[0].text());
    render();
    alert(`Đã thêm ${r.added} sinh viên, cập nhật ${r.updated} sinh viên.`);
  }
  if (el.dataset.input === 'json' && el.files[0]) {
    try {
      const data = JSON.parse(await el.files[0].text());
      if (!Array.isArray(data.students)) throw new Error('Thiếu danh sách students');
      if (data.course && data.course !== COURSE.code && !confirm(`File thuộc học phần ${data.course}, vẫn khôi phục?`)) return;
      state = { ...blank(), students: data.students, groupScores: data.groupScores || {}, groupFlags: data.groupFlags || {}, selected: data.selected || null };
      save(); render();
      alert(`Đã khôi phục ${state.students.length} sinh viên.`);
    } catch (err) {
      alert('File JSON không hợp lệ: ' + err.message);
    }
  }
});

document.addEventListener('toggle', (e) => {
  const d = e.target;
  if (d.tagName === 'DETAILS' && d.dataset.crit) { d.open ? openDetails.add(d.dataset.crit) : openDetails.delete(d.dataset.crit); }
}, true);

render();
</script>
